[package]
name = "calculadora-mac"
version = "0.1.0"
description = "Calculadora desktop estilo macOS"
authors = ["you"]
edition = "2021"

[lib]
name = "calculadora_mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.32"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
